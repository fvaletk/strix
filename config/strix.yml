shared:
  llm:
    text_model: gemini-3.5-flash-lite
    thinking_level: medium
    embedding_model: gemini-embedding-2
    embedding_dimensions: 1536
  extraction:
    min_words: 200
    timeout_seconds: 10
  chunking:
    words: 375
    overlap_words: 50
  retrieval:
    k: 8
    min_similarity: 0.6
