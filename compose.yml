# Local development. `run` in CLAUDE.md's Project config: docker compose exec web
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
    args:
      RUBY_VERSION: "3.4.1"
  env_file:
    - path: .env      # app credentials, once there are any
      required: false
  environment:
    DB_HOST: db
    DB_USERNAME: postgres
    REDIS_URL: redis://redis:6379/0
  volumes:
    - .:/rails
    - bundle:/usr/local/bundle
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0"
    ports:
      - "3000:3000"

  css:
    <<: *app
    command: bin/rails tailwindcss:watch[always]

  sidekiq:
    <<: *app
    command: bundle exec sidekiq

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust   # local only: no published port, no password
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  bundle:
  pg:
